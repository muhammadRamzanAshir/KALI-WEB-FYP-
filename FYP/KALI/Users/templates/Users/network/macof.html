{% load static %}
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Macof | DOS</title>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
        <link href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css' rel='stylesheet'>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-WwPAdFFnT9FvTPbkG/HTPT97jAcTY84f7QszA1XvCRZLOq4yyI8q46W4/8T+mCq+Cl8ekJbMhY5GDBJfUJ47wA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
            .status-box {
                display: none;
            }
            .navbar-brand {
                width: 100%;
                text-align: center;
                font-size: 30px;
            }
        </style>
    </head>
    <body>
        <div class="container-fluid d-flex justify-content-center align-items-center full-height">
            <div class="container mt-5  ">
                <div class="row">
                    <div class="col-md-12">
                        <h1 class="navbar-brand"><i class="bx bx-error-alt"></i> Macof | DOS</h1>
                        <!-- Interface Selection -->
                        <div class="mb-3">
                            <label for="interface" class="form-label">Select Network Interface</label>
                            <select id="interface" class="form-select">
                                <option value="">select interface</option>
                                <option value="eth0">eth0</option>
                                <option value="wlan0">wlan0</option>
                                <option value="ens33">ens33</option>
                                <option value="eth1">eth1</option>
                            </select>
                        </div>
    
                        <!-- Start/Stop Macof Command -->
                        <div class="mb-3">
                            <button id="start-btn" class="btn btn btn-primary">Start Macof</button>
                            <button id="stop-btn" class="btn btn-danger" disabled>Stop Macof</button>
                        </div>
    
                        <!-- Status -->
                        <div class="status-box alert alert-info" id="status-box">
                            <strong>Status:</strong> <span id="status-text">Stopped</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <!-- Bootstrap JS & jQuery -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <script>
            $(document).ready(function() {
                // Start button click event
                $('#start-btn').click(function() {
                    var selectedInterface = $('#interface').val();
        
                    // Update UI for running macof
                    $('#start-btn').prop('disabled', true);
                    $('#stop-btn').prop('disabled', false);
                    $('#status-box').show();
                    $('#status-text').text('Running on ' + selectedInterface);
        
                    // Send AJAX request to start macof command
                    $.ajax({
                        type: 'POST',
                        url: '/macof-controller/',  // Updated to match URL pattern
                        data: {
                            'action': 'start',
                            'interface': selectedInterface,
                            'csrfmiddlewaretoken': '{{ csrf_token }}'
                        },
                        success: function(response) {
                            $('#status-text').text(response.status);
                        },
                        error: function(response) {
                            $('#status-text').text('Error: ' + response.responseJSON.status);
                        }
                    });
                });
        
                // Stop button click event
                $('#stop-btn').click(function() {
                    // Update UI for stopping macof
                    $('#start-btn').prop('disabled', false);
                    $('#stop-btn').prop('disabled', true);
                    $('#status-text').text('Stopping...');
        
                    // Send AJAX request to stop macof command
                    $.ajax({
                        type: 'POST',
                        url: '/macof-controller/',  // Updated to match URL pattern
                        data: {
                            'action': 'stop',
                            'csrfmiddlewaretoken': '{{ csrf_token }}'
                        },
                        success: function(response) {
                            $('#status-text').text(response.status);
                        },
                        error: function(response) {
                            $('#status-text').text('Error: ' + response.responseJSON.status);
                        }
                    });
                });
            });
        </script>
    </body>
    </html>

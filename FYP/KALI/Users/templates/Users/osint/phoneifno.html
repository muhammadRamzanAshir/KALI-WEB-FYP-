<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHONE-INFO </title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<style>
    .nav-bar {
        color: #04ce41;
    }
    button {
        background-color: #04ce41 !important;
        border: none;
    }

    .save-btn {
        background-color: #28a745;
        color: white;
        border: none;
        cursor: pointer;
        padding: 6px 12px;
        font-size: 14px;
    }

    .save-btn:hover {
        background-color: #218838;
    }

    table th, table td {
        text-align: center;
    }

    .table-container {
        margin-top: 20px;
    }

    .table-container table {
        width: 100%;
        margin-bottom: 20px;
    }

    .table-container .save-btn-col {
        width: 150px;
    }
</style>

<body>

<div class="container mt-5">
    <div class="text-center">
        <h1 class="nav-bar"><i class="fas fa-search"></i> Query Data</h1>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <form id="query-form" class="border p-4 shadow-sm rounded">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="query" class="form-label">Enter Mobile Number:</label>
                    <input type="text" id="query" name="query" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-paper-plane"></i> Submit
                </button>
            </form>
        </div>
    </div>

    <div id="results" class="mt-4"></div>
</div>

<!-- Bootstrap JS (Optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<script>
    $(document).ready(function () {
        $('#query-form').on('submit', function (e) {
            e.preventDefault(); // Prevent the default form submission
            
            const csrfToken = $('input[name="csrfmiddlewaretoken"]').val();
            
            // Send the AJAX POST request
            $.ajax({
                url: '/get_mobile_details/', // Current URL
                type: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken  // Add CSRF token to the request header
                },
                data: {
                    query: $('#query').val(),
                },
                success: function (response) {
                    let resultsDiv = $('#results');
                    resultsDiv.empty(); // Clear previous results
                    
                    if (response.data && response.data.length) {
                        let table = '<div class="table-container"><table class="table table-bordered table-striped">';
                        table += '<thead><tr>';
                        
                        // Create table headers dynamically
                        for (let key in response.data[0]) {
                            table += `<th>${key}</th>`;
                        }
                        
                        // Add Save button column header
                        table += '<th>Actions</th>';
                        table += '</tr></thead><tbody>';
                        
                        // Populate table rows
                        response.data.forEach((row, index) => {
                            table += '<tr>';
                            
                            // Create data cells
                            for (let key in row) {
                                table += `<td>${row[key]}</td>`;
                            }
                            
                            // Add Save button to the last column
                            table += `<td class="save-btn-col">
                                        <button class="save-btn" data-index="${index}" onclick="savePhoneDetail(${index})">
                                            Save
                                        </button>
                                    </td>`;
                            table += '</tr>';
                        });
                        
                        table += '</tbody></table></div>';
                        resultsDiv.append(table);
                    } else {
                        resultsDiv.append('<p class="text-warning">No data found.</p>');
                    }
                },
                error: function (xhr, status, error) {
                    $('#results').html(`<p style="color: red;">Error: ${xhr.responseJSON?.error || error}</p>`);
                }
            });
        });
    });

    // Function to handle Save button click
    function savePhoneDetail(index) {
        // Get the data of the selected row
        const row = $(`#results table tbody tr:eq(${index}) td`);
        const phoneDetail = {
            number: row.eq(0).text(),
            name: row.eq(1).text(),
            father_name: row.eq(2).text(),
            cnic: row.eq(3).text(),
            address: row.eq(4).text(),
        };
        
        // Send the data to the server to save it (you can modify the URL and logic to save in DB)
        $.ajax({
            url: '/save_phone_detail/', // Your Django view to save the data
            type: 'POST',
            data: {
                phoneDetail: JSON.stringify(phoneDetail),
                csrfmiddlewaretoken: $('input[name="csrfmiddlewaretoken"]').val()
            },
            success: function(response) {
                alert('Phone detail saved successfully!');
            },
            error: function(xhr, status, error) {
                alert('Error saving phone detail!');
            }
        });
    }
</script>

</body>
</html>

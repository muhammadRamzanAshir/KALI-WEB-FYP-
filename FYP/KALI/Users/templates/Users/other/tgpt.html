{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Chat</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <!-- Custom CSS -->
</head>
<style>
    .navbar-brand {
        text-align: center;
        font-size: 45px;
        color: #40cc45;
    }
    .fas{
        color: #40cc45 !important;
    }
    .rounded{
        border-radius: 20px !important;
        background-color: #fff;
    }
    .bubble{
        background-color: #40cc45;
        padding: 40px 40px;
        border-radius: 20px;
        color: #fff;
    }
    .one{
        position: absolute;
        z-index: -1;
        bottom: 0;
        width: 100%;
    }
    .change-color{
        background-color: #40cc45 !important;
        border: none;
    }
    .chat-body {
        max-height: 400px;  /* Set a fixed height for the chat area */
        overflow-y: auto;   /* Enable vertical scrolling */
        padding-right: 10px; /* Optional: Prevent horizontal scroll if padding causes overflow */
    }
    .glassmorphism{
        height: 80vh;
    }
    .chat-footer{
        position: absolute;
        bottom: 0%;
        width: 100%;
    }
    .buuble-1{
        background-color: rgb(14, 189, 165);
        padding: 40px 40px;
        border-radius: 20px;
        color: #fff;
    }
</style>
<body>
    <div class="container">
        <header class="d-flex justify-content-center py-3">
            <ul class="nav nav-pills">
                <h1 class="navbar-brand"> <i class="fas fa-robot fa-1x    "></i> AI ASSISTANT</h1>
            </ul>
        </header>
    </div>
    <div class="container py-5 rounded shadow-lg bg-light card " style="height: 80vh;">
        <!-- Chat Wrapper -->
        <div class="chat-wrapper ">
            <!-- Chat Body -->
            <div class="chat-body p-3 " id="chat-body">
                <div class="message received">
                    <div class="d-flex align-items-start">
                        <i class="fas fa-robot fa-2x text-primary me-2"></i>
                        <div>
                            <p class="bubble">Hello! I'm here to assist you. How can I help today?</p>
                            <span class="time">10:00 AM</span>
                        </div>
                    </div>
                </div>
                <div class="message sent">
                    <div class="d-flex align-items-center justify-content-end ">
                        <div class="">
                            <p class="buuble buuble-1">Hi there! Can you tell me about the weather?</p>
                            <span class="time">10:01 AM</span>
                        </div>
                        <i class="fas fa-user-circle fa-2x text-secondary ms-2"></i>
                    </div>
                </div>
                <div class="message received">
                    <div class="d-flex align-items-start">
                        <i class="fas fa-robot fa-2x text-primary me-2"></i>
                        <div>
                            <p class="bubble">Sure! The current weather is sunny with a temperature of 25°C.</p>
                            <span class="time">10:02 AM</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Chat Footer -->
            <div class="chat-footer p-3">
                <form class="d-flex align-items-center" method="POST">
                    {% csrf_token %}
                    <input type="text" class="form-control me-2 p-2" placeholder="Type your message here..." id="user-message">
                    <button type="button" class="btn btn-primary px-4 change-color">Send</button>
                </form>
            </div>
        </div>
    </div>
    <div class="one">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
            <path fill="#4ab74e" fill-opacity="1" d="M0,32L120,74.7C240,117,480,203,720,202.7C960,203,1200,117,1320,74.7L1440,32L1440,320L1320,320C1200,320,960,320,720,320C480,320,240,320,120,320L0,320Z"></path>
        </svg>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelector('.change-color').addEventListener('click', function() {
            var message = document.querySelector('#user-message').value;
        
            // Don't send if the message is empty
            if (message.trim() !== '') {
                var chatBody = document.getElementById('chat-body');
                var currentTime = new Date().toLocaleTimeString();
        
                // Add the user's message to the chat
                chatBody.innerHTML += `
                    <div class="message sent">
                        <div class="d-flex align-items-center justify-content-end">
                            <div>
                                <p class="bubble-1">${message}</p>
                                <span class="time">${currentTime}</span>
                            </div>
                            <i class="fas fa-user-circle fa-2x text-primary ms-2"></i>
                        </div>
                    </div>
                `;
        
                // Clear the input field
                document.querySelector('#user-message').value = '';
        
                // Show a loading spinner while waiting for the response
                chatBody.innerHTML += `
                    <div class="message received loading">
                        <div class="d-flex align-items-start">
                            <i class="fas fa-robot fa-2x text-primary me-2"></i>
                            <div>
                                <p class="bubble"></p>
                                <span class="time">${currentTime}</span>
                            </div>
                        </div>
                    </div>
                `;
                
                // Scroll to the bottom of the chat
                chatBody.scrollTop = chatBody.scrollHeight;
        
                // Send the message to the Django backend using AJAX
                fetch('{% url "chat" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: `message=${message}`
                })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        // Remove loading message and show error
                        chatBody.querySelector('.loading').remove();
                        chatBody.innerHTML += `
                            <div class="message received">
                                <div class="d-flex align-items-start">
                                    <i class="fas fa-robot fa-2x text-primary me-2"></i>
                                    <div>
                                        <p class="bubble">Error: ${data.error}</p>
                                        <span class="time">${currentTime}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    } else {
                        // Remove loading message and add the bot's response
                        chatBody.querySelector('.loading').remove();
                        chatBody.innerHTML += `
                            <div class="message received">
                                <div class="d-flex align-items-start">
                                    <i class="fas fa-robot fa-2x text-primary me-2"></i>
                                    <div>
                                        <p class="bubble">${data.data}</p>
                                        <span class="time">${currentTime}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
        
                    // Scroll to the bottom of the chat
                    chatBody.scrollTop = chatBody.scrollHeight;
                })
                .catch(error => {
                    console.error('Error:', error);
                    // Remove loading message and show error
                    chatBody.querySelector('.loading').remove();
                    chatBody.innerHTML += `
                        <div class="message received">
                            <div class="d-flex align-items-start">
                                <i class="fas fa-robot fa-2x text-primary me-2"></i>
                                <div>
                                    <p class="bubble">Error: Something went wrong!</p>
                                    <span class="time">${currentTime}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
        });
    </script>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crack Hash with John the Ripper</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <link href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-WwPAdFFnT9FvTPbkG/HTPT97jAcTY84f7QszA1XvCRZLOq4yyI8q46W4/8T+mCq+Cl8ekJbMhY5GDBJfUJ47wA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #progressBarContainer {
            display: none;
        }
        #result {
            display: none;
        }
        #errorMessage {
            display: none;
        }
        #result {
            display: none;
            margin-top: 12px;
        }
        #progressBar {
            background: #3cd541;
        }
        #cewlResults {
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .alert-info {
            background-color: white;
            font-weight: bolder;
        }
        .navbar-brand {
            width: 100%;
            text-align: center;
            font-size: 40px;
        }
        label {
            color: #40cc45;
        }
        #progressBar {
            background: #3cd541;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center navbar-brand"><i class="bx bx-lock"></i>JOHN-THE-RIPPER</h1>
        <hr>
        <!-- Display success or error message -->
        <div id="progressBarContainer">
            <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated" id="progressBar" style="width: 0%"></div>
            </div>
            <p class="text-center mt-2" id="progressText">Cracking in progress...</p>
        </div>

        <!-- Upload form for selecting hash file -->
        <form id="hashForm" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="hash_file" class="form-label">Select Hash File</label>
                <select name="hash_file" id="hash_file" class="form-control" required>
                    <option value="">Select a hash file</option>
                    {% for hash_file in hash_files %}
                        <option value="{{ hash_file }}">{{ hash_file }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="row">
                <div class="col-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="isCracked" name="isCracked">
                        <label class="form-check-label" for="isCracked" title="">is it Cracked</label>
                    </div>
                </div>
            </div>
            <button type="submit" id="submitBtn" class="btn btn-primary">Crack Hash</button>
        </form>

        <!-- Progress Bar -->
        
    <div id="errorMessage" class="alert alert-danger text-center pt-4"></div>
    <div id="result" class="alert alert-success text-center">
        <h4>Cracked Password</h4>
        <p id="password"></p>
    </div>
</div>

    <script>
        document.getElementById("hashForm").addEventListener("submit", function(event) {
            event.preventDefault();
        
            // Check if the checkbox is checked
        
            const formData = new FormData(this);
            const isCrackedCheckbox = document.getElementById("isCracked");
            formData.append('isCracked', isCrackedCheckbox.checked ? 'true' : 'false');
            const progressBarContainer = document.getElementById("progressBarContainer");
            const progressBar = document.getElementById("progressBar");
            const submitBtn = document.getElementById("submitBtn");
            const errorMessage = document.getElementById("errorMessage");
            const result = document.getElementById("result");
            const passwordDisplay = document.getElementById("password");
        
            // Show progress bar and disable submit button
            progressBarContainer.style.display = 'block';
            progressBar.style.width = '0%';
            submitBtn.disabled = true;
            errorMessage.style.display = 'none';
            result.style.display = 'none';
        
            // Make the request to crack the hash
            fetch('/run_john/', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                // If there's an error, display it
                if (data.error) {
                    errorMessage.innerText = data.error;
                    errorMessage.style.display = 'block';
                    submitBtn.disabled = false;
                    progressBarContainer.style.display = 'none';
                } else {
                    // If password is cracked, display the result
                    passwordDisplay.innerText = data.password;
                    result.style.display = 'block';
                    progressBar.style.width = '100%';
                }
            })
            .catch(err => {
                console.error('Error:', err);
                errorMessage.innerText = "Something went wrong. Please try again.";
                errorMessage.style.display = 'block';
                submitBtn.disabled = false;
                progressBarContainer.style.display = 'none';
            });
        });
    </script>
</body>
</html>

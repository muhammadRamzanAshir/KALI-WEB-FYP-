{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://unpkg.com/boxicons/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.1/css/boxicons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
</head>
<body>
    <div class="container-fluid vh-100 d-flex align-items-center">
        <div class="row w-100">
            <div class="col-md-6 d-none d-md-block p-0">
                <img id="side-image" src="{% static 'images/join.png' %}" alt="Side Image" width="80%" class="img-fluid h-100 ml-5">
            </div>
            <div class="col-md-6 d-flex align-items-center justify-content-center login-form">
                <div id="login-form" class="glassmorphism p-4 w-100">
                    <h2 class="mb-4 mt-3 headings" style="text-align: center;">SIGNUP</h2>
                    {% if messages %}
                        <div class="mb-4">
                            {% for message in messages %}
                                <div class="alert alert-success" role="alert">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}

                    <form method="POST" action="{% url 'signup' %}">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="id_username">Username</label>
                            <input type="text" class="form-control" id="id_username" name="username" required>
                        </div>
                        <div class="form-group position-relative">
                            <label for="id_password1">Password</label>
                            <input type="password" class="form-control" id="id_password1" name="password1" required>
                            <i class="fa fa-eye position-absolute mt-2" style="right: 10px; top: 35px; cursor: pointer; color: rgb(7, 229, 29);" onclick="togglePasswordVisibility('id_password1', this)"></i>
                        </div>
                        <div class="form-group position-relative">
                            <label for="id_password2">Confirm Password</label>
                            <input type="password" class="form-control" id="id_password2" name="password2" required>
                            <i class="fa fa-eye position-absolute mt-2" style="right: 10px; top: 35px; cursor: pointer; color: rgb(7, 229, 29);" onclick="togglePasswordVisibility('id_password2', this)"></i>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Signup</button>
                    </form>
                    <p class="mt-3">Already have an account? <a href="{% url 'login' %}" style="text-align: left; color: rgb(7, 229, 29);">LOGIN</a></p>
                </div>
            </div>
        </div>
    </div>
    <a style="background-color: rgb(87, 228, 10); padding: 12px 12px; border-radius: 100%; text-align: center; position: absolute; right: 4%; top: 90%; box-shadow: 0 8px 32px 0 rgba(101, 101, 101, 0.37); color: aliceblue;" href="{% url 'index' %}"><i class="fa fa-home" aria-hidden="true"></i></a>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
</body>
<script>
    function togglePasswordVisibility(id, icon) {
        var input = document.getElementById(id);
        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = "password";
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
</script>
</html>

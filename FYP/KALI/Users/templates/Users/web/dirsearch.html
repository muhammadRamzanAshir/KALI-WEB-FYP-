{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dirsearch</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        #cewlResults {
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .alert-info {
            background-color: white;
            font-weight: bolder;
        }
        .navbar-brand {
            width: 100%;
            text-align: center;
            font-size: 30px;
        }
        label {
            color: #40cc45;
        }
        #progressBar {
            background: #3cd541;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="navbar-brand"><i class='bx bx-folder'></i> Dirsearch</h1>
        <div class="form-group">
            <label for="url"><i class='bx bx-target-lock'></i> URL:</label>
            <input type="text" id="url" class="form-control" placeholder="Enter wordlist path (e.g., https://example.com)" required>
        </div>
        <button type="button" id="generateBtn" class="btn btn-primary mt-3"><i class="bx bx-play-circle"></i> Scan</button>
        <br>
        <br>
        
        <!-- Nav tabs -->
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item">
                <a class="nav-link active" id="settings-tab" data-toggle="tab" href="#settings" role="tab" aria-controls="settings" aria-selected="true">Settings</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="results-tab" data-toggle="tab" href="#results" role="tab" aria-controls="results" aria-selected="false">Results</a>
            </li>
        </ul>
        
        <!-- Tab content -->
        <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="settings" role="tabpanel" aria-labelledby="settings-tab">
                <form id="cewlForm">
                    
                    <div class="row pl-2 pt-1">
                        <div class="col-3 pl-1 mb-3">
                            <label for="portno"><i class="bx bx-list-ul"></i>No of Threads</label>
                            <input type="number" id="portno" class="form-control" min="1" max="65535" placeholder="Number of threads">
                        </div>
                        <div class="col-3 pl-1">
                            <label for="extension"><i class="bx bx-plug"></i>Extension</label>
                            <select id="extension" class="form-control">
                                <option value="">Select</option>
                                <option value="asp">Active Server Pages files</option>
                                <option value="aspx">ASP.NET files</option>
                                <option value="bak">Backup files</option>
                                <option value="cgi">Common Gateway Interface files</option>
                                <option value="com">Remote File Retrieval</option>
                                <option value="conf">Configuration files</option>
                                <option value="dat">Data files</option>
                                <option value="db">Database files</option>
                                <option value="dll">Dynamic Link Library files</option>
                                <option value="do">Action-based files (Java frameworks)</option>
                                <option value="env">Environment files</option>
                                <option value="exe">Executable files</option>
                                <option value="htm">HTML files (HTM)</option>
                                <option value="html">HTML files</option>
                                <option value="jar">Java Archive files</option>
                                <option value="jsp">Java Server Pages</option>
                                <option value="log">Log files</option>
                                <option value="php">PHP files</option>
                                <option value="pl">Perl scripts</option>
                                <option value="py">Python scripts</option>
                                <option value="rb">Ruby scripts</option>
                                <option value="sh">Shell scripts</option>
                                <option value="sql">SQL files</option>
                                <option value="swp">Swap files (used by editors like Vim)</option>
                                <option value="tar">Tar archive files</option>
                                <option value="war">Web Application Archive files</option>
                                <option value="xml">XML files</option>
                                <option value="yaml">YAML files</option>
                                <option value="yml">YML files</option>
                                <option value="zip">Zip archive files</option>
                                <option value="all">All</option>
                            </select>
                        </div>
                        <div class="col-3 pl-1">
                            <label for="responseCode"><i class="bx bx-server"></i>Filter Response Code</label>
                            <select id="responseCode" class="form-control">
                                <option value="">Select</option>
                                <option value="200">200</option>
                                <option value="204">204</option>
                                <option value="301">301</option>
                                <option value="302">302</option>
                                <option value="304">304</option>
                                <option value="400">400</option>
                                <option value="401">401</option>
                                <option value="403">403</option>
                                <option value="405">405</option>
                                <option value="500">500</option>
                                <option value="503">503</option>
                                <option value="504">504</option>
                                <option value="all">All</option>
                            </select>
                        </div>
                    </div>
                    <div class="row pl-2 pt-1">
                        <div class="col-3 pl-1">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="exclude404">
                                <label class="form-check-label" for="exclude404">Exclude 404</label>
                            </div>
                        </div>
                        <div class="col-3 pl-1">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="randomUserAgent">
                                <label class="form-check-label" for="randomUserAgent">Random User Agent</label>
                            </div>
                        </div>
                        <div class="col-3 pl-1">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="recursiveBruteForce">
                                <label class="form-check-label" for="recursiveBruteForce">Brute-force Recursively</label>
                            </div>
                        </div>
                        <div class="col-3 pl-1">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="enableCrawling">
                                <label class="form-check-label" for="enableCrawling">Enable Crawling</label>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="tab-pane fade" id="results" role="tabpanel" aria-labelledby="results-tab">
                <div class="mt-3">
                    <pre id="cewlResults" class="alert alert-info"><i class="bx bx-info-circle"></i> Report will appear here</pre>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#generateBtn').click(function() {
                const url = $('#url').val();
                const threads = $('#portno').val();
                const extension = $('#extension').val();
                
                $('#cewlResults').html(''); // Clear previous results

                $.ajax({
                    url: '/run_dirsearch/',
                    type: 'POST',
                    data: {
                        url: url,
                        threads: threads,
                        extension: extension,
                        csrfmiddlewaretoken: '{{ csrf_token }}'
                    },
                    xhr: function() {
                        const xhr = new window.XMLHttpRequest();
                        xhr.open('POST', '/run_dirsearch/', true);
                        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        
                        xhr.onreadystatechange = function() {
                            if (xhr.readyState === XMLHttpRequest.LOADING) { // Loading state
                                $('#cewlResults').append(xhr.responseText); // Append live output
                            }
                        };
        
                        return xhr;
                    },
                    success: function(response) {
                        // Handle completion if needed
                        console.log("Scan completed");
                    },
                    error: function(xhr, textStatus, error) {
                        $('#cewlResults').html('<i class="bx bx-error-circle"></i> Error: ' + xhr.statusText).removeClass().addClass('alert alert-danger');
                    }
                });
            });
        });
    </script>
</body>
</html>
